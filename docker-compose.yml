name: myblog-local

# 本地一键部署：从源码构建，不依赖 Jenkins、Registry、域名或 SSL 证书。
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    ports: ["127.0.0.1:15432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Shanghai}
    command: [postgres, -c, max_connections=30, -c, shared_buffers=256MB, -c, effective_cache_size=512MB, -c, work_mem=4MB]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    networks: [blog-net]
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports: ["127.0.0.1:6379:6379"]
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    networks: [blog-net]
    restart: unless-stopped

  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
      args:
        MAVEN_TEST_SKIP: "true"
    image: myblog-api:local
    ports: ["127.0.0.1:8000:8000"]
    environment:
      APP_PORT: "8000"
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ENGAGEMENT_HASH_SECRET: ${ENGAGEMENT_HASH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN}
      OSS_OBJECT_PREFIX: ${OSS_OBJECT_PREFIX-}
      OSS_MAX_FILE_SIZE_MB: ${OSS_MAX_FILE_SIZE_MB:-10}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD}
      LOG_PATH: /logs
    volumes: [./logs:/logs]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c 'exec 3<>/dev/tcp/localhost/8000 && printf "GET /api/v1/health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    mem_limit: 1g
    networks: [blog-net]
    restart: unless-stopped

  frontend-web:
    build:
      context: ./myblog
      dockerfile: Dockerfile
    image: myblog-web:local
    depends_on: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    networks: [blog-net]
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        ADMIN_ROUTE: ${ADMIN_ROUTE:-/admin}
    image: myblog-admin:local
    depends_on: [backend]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    networks: [blog-net]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    environment:
      ADMIN_ROUTE: ${ADMIN_ROUTE:-/admin}
      TZ: ${TZ:-Asia/Shanghai}
    ports: ["80:80"]
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on: [frontend-web, frontend-admin, backend]
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    networks: [blog-net]
    restart: unless-stopped

networks:
  blog-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
