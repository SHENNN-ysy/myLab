name: myblog

# 2核4G生产部署：Nginx + Java + PostgreSQL + Redis。
# 图片由Java通过OSS内网上传，并通过CDN域名访问。
services:
  db:
    ports:
      - "127.0.0.1:15432:5432" # 本机 5432 被本地 PostgreSQL 占用，主机侧改映射到 15432
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend-java/src/main/resources/db/migration/V1__initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend-java/src/main/resources/db/migration/V2__initial_data.sql:/docker-entrypoint-initdb.d/02_initial_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    networks: [blog-net]
    restart: unless-stopped

  redis:
    ports:
      - "127.0.0.1:6379:6379"
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-myblog_redis_secret}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-myblog_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 160m
    networks: [blog-net]
    restart: unless-stopped

  api:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    image: ${API_IMAGE:-myblog-api:latest}
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_PORT: "8000"
      TZ: ${TZ:-Asia/Shanghai}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_POOL_SIZE: "5"
      DB_MIN_IDLE: "1"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-myblog_redis_secret}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN}
      OSS_OBJECT_PREFIX: ${OSS_OBJECT_PREFIX:-images}
      OSS_MAX_FILE_SIZE_MB: ${OSS_MAX_FILE_SIZE_MB:-10}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-Admin@123456}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 1g
    networks: [blog-net]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    image: ${WEB_IMAGE:-myblog-web:latest}
    environment:
      BLOG_DOMAIN: ${BLOG_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    ports:
      - "80:80"
    depends_on:
      - api
    mem_limit: 128m
    networks: [blog-net]
    restart: unless-stopped

networks:
  blog-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
