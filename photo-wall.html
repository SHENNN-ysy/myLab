<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行随拍 · Photo Wall</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #7ea696;        /* 鼠尾草绿 */
    --accent-warm: #d9a08c;   /* 陶土橘 */
    --ink: #41524a;
  }

  body {
    background:
      radial-gradient(1200px 600px at 15% -5%, #fdf9ef 0%, transparent 60%),
      radial-gradient(900px 500px at 95% 10%, #eef5ef 0%, transparent 55%),
      #f6f4ee;
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- 顶部标题 ---------- */
  header {
    text-align: center;
    padding: 56px 20px 30px;
    position: relative;
  }
  header h1 {
    font-size: clamp(26px, 4.5vw, 40px);
    font-weight: 400;
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--ink);
  }
  header h1 em {
    font-style: normal;
    color: var(--accent);
  }
  header p {
    margin-top: 12px;
    font-size: 12px;
    letter-spacing: .45em;
    text-indent: .45em;
    color: #a8b3ab;
  }
  header::after {
    content: "";
    display: block;
    width: 72px; height: 2px;
    margin: 22px auto 0;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--accent-warm), transparent);
  }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    padding: 0 20px;
  }
  .btn {
    border: 1px solid #d8ddd6;
    background: #fff;
    color: #6c7a70;
    padding: 10px 24px;
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: .15em;
    cursor: pointer;
    transition: all .25s;
    box-shadow: 0 2px 8px rgba(90,110,95,.06);
  }
  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(126,166,150,.18);
  }
  .btn.primary {
    background: linear-gradient(120deg, var(--accent), #a5c3a6);
    border: none;
    color: #fff;
    font-weight: 600;
  }
  .btn.primary:hover { color: #fff; box-shadow: 0 10px 24px rgba(126,166,150,.35); }

  /* ---------- 错落照片墙 ---------- */
  .wall {
    position: relative;
    max-width: 1280px;
    margin: 0 auto;
    padding-bottom: 60px;
  }

  .card {
    position: absolute;
    background: #fff;
    padding: 12px 12px 0;
    border-radius: 4px;
    box-shadow: 0 4px 14px rgba(70,85,75,.14), 0 1px 3px rgba(70,85,75,.1);
    cursor: zoom-in;
    transform: rotate(var(--rot, 0deg));
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
    animation: pop .5s ease backwards;
    will-change: transform;
  }
  @keyframes pop {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .card:hover {
    transform: rotate(0deg) scale(1.05) translateY(-6px);
    box-shadow: 0 18px 40px rgba(70,85,75,.25);
    z-index: 999 !important;
  }

  /* 胶带 */
  .card::before {
    content: "";
    position: absolute;
    top: -12px;
    left: 50%;
    width: 84px; height: 24px;
    transform: translateX(-50%) rotate(-3deg);
    background: rgba(190, 214, 200, .55);
    border-left: 1px dashed rgba(255,255,255,.6);
    border-right: 1px dashed rgba(255,255,255,.6);
    box-shadow: 0 1px 3px rgba(70,85,75,.08);
    z-index: 2;
  }
  .card:nth-child(even)::before { transform: translateX(-50%) rotate(4deg); background: rgba(233, 206, 190, .5); }

  .card img {
    display: block;
    width: 100%;
    border-radius: 2px;
    background: #eef0ea;
  }

  .caption {
    padding: 10px 4px 12px;
    font-size: 12px;
    color: #93a297;
    text-align: center;
    letter-spacing: .08em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 悬停操作按钮 */
  .card .ops {
    position: absolute;
    top: 6px;
    right: 6px;
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity .25s;
    z-index: 3;
  }
  .card:hover .ops { opacity: 1; }
  .ops button {
    border: none;
    border-radius: 999px;
    width: 30px; height: 30px;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    transition: transform .2s;
  }
  .ops button:hover { transform: scale(1.15); }
  .ops .replace { background: #fff; color: var(--accent); }
  .ops .del     { background: #fff; color: #c77; }

  /* 空状态 */
  .empty {
    text-align: center;
    color: #a8b3ab;
    padding: 90px 20px;
    letter-spacing: .2em;
    font-size: 14px;
  }

  /* ---------- 灯箱 ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(30, 38, 33, .88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    cursor: zoom-out;
    backdrop-filter: blur(6px);
  }
  .lightbox.show { display: flex; animation: fadeIn .25s; }
  @keyframes fadeIn { from { opacity: 0; } }
  .lightbox img {
    max-width: 90vw;
    max-height: 88vh;
    border-radius: 6px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<header>
  <h1>旅 行 <em>随</em> 拍</h1>
  <p>S C A T T E R E D &nbsp; M E M O R I E S</p>
</header>

<div class="toolbar">
  <button class="btn primary" id="btnAdd">＋ 添加照片</button>
  <button class="btn" id="btnShuffle">随意重排</button>
  <button class="btn" id="btnClear">清空全部</button>
</div>

<div class="wall" id="wall"></div>
<div class="empty" id="emptyTip" style="display:none">还没有照片，点击上方「添加照片」开始吧</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

<input type="file" id="fileInput" accept="image/*" hidden>
<input type="file" id="fileInputMulti" accept="image/*" multiple hidden>

<script>
(function () {
  const LS_KEY = 'photo-wall-images-v2';
  const wall = document.getElementById('wall');
  const emptyTip = document.getElementById('emptyTip');
  const fileInput = document.getElementById('fileInput');
  const fileInputMulti = document.getElementById('fileInputMulti');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  let images = load();
  let replaceTarget = null;

  function load() {
    let arr;
    try { arr = JSON.parse(localStorage.getItem(LS_KEY)) || []; }
    catch { arr = []; }
    // 老数据补随机姿态
    arr.forEach(it => { if (it.rot === undefined) Object.assign(it, randomPose()); });
    return arr;
  }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(images)); }
    catch { alert('图片太大，超出浏览器本地存储上限，请换一张更小的图。'); }
  }

  /* 每张照片的"随手摆放"姿态：旋转角、水平/垂直偏移、层叠次序 */
  function randomPose() {
    return {
      rot: (Math.random() * 10 - 5).toFixed(2),   // -5° ~ 5°
      jx:  Math.random() * 2 - 1,                  // 水平偏移系数
      jy:  Math.random() * 2 - 1,                  // 垂直偏移系数
      z:   Math.floor(Math.random() * 50) + 1      // 层叠次序
    };
  }

  function compress(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1280;
          let { width, height } = img;
          if (width > MAX) { height = Math.round(height * MAX / width); width = MAX; }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve({ src: canvas.toDataURL('image/jpeg', 0.85), ratio: height / width });
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  /* ---------- 错落布局：短列优先 + 随机偏移 + 边缘重叠 ---------- */
  function layout() {
    const W = wall.clientWidth;
    if (!W) return;
    // 固定 4 列（小屏 2 列），列距为卡片宽度的 80%，保证边缘互相压叠
    const cols = W < 640 ? 2 : 4;
    const padX = 12, capH = 40;                            // 白边 + 底部文字区
    // 由可用宽度反推照片宽度，让 N 列按 0.8 列距恰好铺满整行
    const photoW = Math.min(300, Math.round(W / (0.8 * (cols - 1) + 1)) - padX * 2);
    const cardW = photoW + padX * 2;
    const pitch = Math.round(cardW * 0.8);
    // 整体居中，两侧留白对称
    const offsetX = Math.max(0, (W - (pitch * (cols - 1) + cardW)) / 2);
    const ys = new Array(cols).fill(10);

    images.forEach(item => {
      const el = item._el;
      if (!el) return;
      // 找当前最短的列
      let col = 0;
      for (let c = 1; c < cols; c++) if (ys[c] < ys[col]) col = c;

      const h = photoW * (item.ratio || 0.75) + padX + capH;
      const x = offsetX + col * pitch + item.jx * 20;   // 水平抖动，压叠位置更自然
      const y = ys[col] + item.jy * 12;                 // 垂直抖动

      el.style.width = cardW + 'px';
      el.style.left = Math.max(0, Math.min(x, W - cardW)) + 'px';
      el.style.top = y + 'px';
      el.style.setProperty('--rot', item.rot + 'deg');
      el.style.zIndex = item.z;

      ys[col] = y + h - 18;   // 负间距：下一张轻微压上来
    });

    wall.style.height = Math.max(...ys) + 30 + 'px';
  }

  function render() {
    wall.innerHTML = '';
    emptyTip.style.display = images.length ? 'none' : 'block';

    images.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = (i * 50) + 'ms';

      const img = document.createElement('img');
      img.src = item.src;
      img.alt = item.name || 'photo';
      // 补记宽高比（老数据可能没有）
      img.addEventListener('load', () => {
        if (!item.ratio) {
          item.ratio = img.naturalHeight / img.naturalWidth;
          save(); layout();
        }
      });
      img.addEventListener('click', () => {
        lightboxImg.src = item.src;
        lightbox.classList.add('show');
      });

      const caption = document.createElement('div');
      caption.className = 'caption';
      caption.textContent = (item.name || 'untitled').replace(/\.[^.]+$/, '');

      const ops = document.createElement('div');
      ops.className = 'ops';

      const btnReplace = document.createElement('button');
      btnReplace.className = 'replace';
      btnReplace.title = '更换照片';
      btnReplace.textContent = '⟳';
      btnReplace.addEventListener('click', ev => {
        ev.stopPropagation();
        replaceTarget = item.id;
        fileInput.click();
      });

      const btnDel = document.createElement('button');
      btnDel.className = 'del';
      btnDel.title = '删除照片';
      btnDel.textContent = '×';
      btnDel.addEventListener('click', ev => {
        ev.stopPropagation();
        if (confirm('确定删除这张照片吗？')) {
          images = images.filter(x => x.id !== item.id);
          save(); render();
        }
      });

      ops.appendChild(btnReplace);
      ops.appendChild(btnDel);
      card.appendChild(img);
      card.appendChild(caption);
      card.appendChild(ops);
      wall.appendChild(card);
      item._el = card;
    });

    layout();
  }

  /* 更换单张 */
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file || replaceTarget == null) return;
    const { src, ratio } = await compress(file);
    const item = images.find(x => x.id === replaceTarget);
    if (item) { item.src = src; item.ratio = ratio; item.name = file.name; save(); render(); }
    replaceTarget = null;
  });

  /* 批量添加 */
  document.getElementById('btnAdd').addEventListener('click', () => fileInputMulti.click());
  fileInputMulti.addEventListener('change', async () => {
    const files = [...fileInputMulti.files];
    fileInputMulti.value = '';
    for (const f of files) {
      const { src, ratio } = await compress(f);
      images.push(Object.assign({
        id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
        src, ratio, name: f.name
      }, randomPose()));
    }
    save(); render();
  });

  /* 随意重排：重新掷一次姿态 */
  document.getElementById('btnShuffle').addEventListener('click', () => {
    images.forEach(it => Object.assign(it, randomPose()));
    save(); layout();
  });

  /* 清空 */
  document.getElementById('btnClear').addEventListener('click', () => {
    if (images.length && confirm('确定清空所有照片吗？')) {
      images = []; save(); render();
    }
  });

  /* 灯箱关闭 */
  lightbox.addEventListener('click', () => lightbox.classList.remove('show'));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') lightbox.classList.remove('show');
  });

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 150);
  });

  render();
})();
</script>
</body>
</html>
