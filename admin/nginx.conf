server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # 启用 gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 反代：把 /api 反向代理到后端 FastAPI 容器（api:8000）
    #   - rewrite 作用：因为后端 router mount 在 /api/v1，前端打的 /api/v1/...
    #     透传即可（保留 /api 前缀到后端，与 main.py 中 api_router(prefix='/api') 对应）
    #   - http://api:8000 走 docker 网络 blog-net
    #   - 30s 超时与后端 uvicorn 默认对齐
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
    }

    # SPA fallback - 所有未匹配的路由都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 简单健康检查
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
